name: Build SpringPetClinic
on:
  push:
    branches: 'main'
jobs:
  build_and_publish_image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo branch
        uses: actions/checkout@v4
      - name: Setup DockerBuildX
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}      
      - name: list files
        run: ls -la
      - name: build spring application
        working-directory: ./spring-petclinic
        run: docker image build -t alammanoj/spring-boot:1.0.0 .
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot:1.0.0




